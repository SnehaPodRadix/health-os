<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap');
body{margin:0;background:#e9e8e3;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#4b4b52;}
.hand{font-family:'Architects Daughter','Comic Sans MS',cursive;}
a{color:#4b57c9;text-decoration:none;} a:hover{color:#333da3;}
.bar{background:#cfcfc9;border-radius:6px;height:10px;display:block;}
.bar.dark{background:#b6b6ae;}
.btn{border:1.5px solid #9a9a94;border-radius:24px;padding:11px 18px;background:#fff;color:#55555c;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;cursor:default;}
.btn.primary{background:#5b66cc;border-color:#5b66cc;color:#fff;}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#7c7c76;font-size:14.5px;font-weight:600;}
.nav.active{background:#e8ebff;color:#4750b8;}
.dot{width:12px;height:12px;border-radius:50%;}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eef0ff;color:#6069c0;}
</style>
</helmet>

<div style="width:1200px;height:860px;box-sizing:border-box;padding:26px;display:flex;">
  <div style="flex:1;display:flex;flex-direction:column;border:1.5px solid #c4c4bd;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.06);">
    <!-- chrome -->
    <div style="height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#f3f2ee;border-bottom:1.5px solid #dedcd5;">
      <span class="dot" style="background:#e2b3b0;"></span><span class="dot" style="background:#e6d3a8;"></span><span class="dot" style="background:#bcd6b4;"></span>
      <div style="flex:1;display:flex;justify-content:center;"><div style="min-width:320px;height:26px;border-radius:14px;background:#fff;border:1.5px solid #dcdad3;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#9a9a94;">healthos.app/home</div></div>
    </div>

    <div style="flex:1;display:flex;min-height:0;">
      <!-- side nav -->
      <div style="width:224px;box-sizing:border-box;padding:22px 16px;border-right:1.5px solid #e4e2db;display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px;">
          <div style="width:32px;height:32px;border-radius:9px;background:#5b66cc;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></div>
          <span class="hand" style="font-size:20px;color:#3a3f66;">Health OS</span>
        </div>
        <div class="nav active"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</div>
        <div class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M7 3h8l5 5v13H7z"/></svg>Records</div>
        <div class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</div>
        <div class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Insights</div>
        <div style="margin-top:auto;" class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile</div>
      </div>

      <!-- main -->
      <div style="flex:1;box-sizing:border-box;padding:30px 34px;overflow:hidden;">
        <!-- top row -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;">
          <div>
            <div class="hand" style="font-size:28px;color:#42424a;">Good morning, Sneha</div>
            <div style="margin-top:9px;"><span class="bar" style="width:230px;"></span></div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:200px;height:38px;border-radius:20px;background:#f4f3ef;border:1.5px solid #e0ded7;display:flex;align-items:center;gap:9px;padding:0 14px;color:#a8a8a2;font-size:13.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a8a2" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search…</div>
            <div style="width:38px;height:38px;border-radius:50%;background:#e8ebff;border:1.5px solid #d1d6f5;"></div>
          </div>
        </div>

        <!-- upload zone -->
        <div style="margin-top:26px;border:2px dashed #b6bce8;border-radius:16px;background:#f6f7ff;padding:34px;display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:56px;height:56px;border-radius:14px;background:#fff;border:1.5px solid #d1d6f5;display:flex;align-items:center;justify-content:center;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5b66cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          </div>
          <div class="hand" style="font-size:21px;color:#4750b8;margin-top:14px;">Drag &amp; drop your medical records</div>
          <div style="margin-top:6px;font-size:13.5px;color:#98988f;">Images (JPG, PNG) or PDF · up to 20&nbsp;MB each</div>
          <div class="btn primary" style="margin-top:18px;">Browse files</div>
        </div>

        <!-- recent records -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:30px;">
          <div class="hand" style="font-size:20px;color:#54545c;">Recent records</div>
          <a href="#" style="font-size:13.5px;">View all</a>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px;margin-top:16px;">
          <!-- card 1 -->
          <div style="border:1.5px solid #e0ded7;border-radius:14px;padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:40px;height:40px;border-radius:10px;background:#fff0ec;display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d98b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M7 3h8l5 5v13H7z"/></svg></div>
              <span class="tag" style="background:#fdeee9;color:#c97e6b;">Lab report</span>
            </div>
            <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;"><span class="bar dark" style="width:80%;"></span><span class="bar" style="width:50%;"></span></div>
          </div>
          <!-- card 2 -->
          <div style="border:1.5px solid #e0ded7;border-radius:14px;padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:40px;height:40px;border-radius:10px;background:#eef0ff;display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6069c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4H9zM7 7h10v14H7z"/><path d="M10 12h4M10 16h4"/></svg></div>
              <span class="tag">Prescription</span>
            </div>
            <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;"><span class="bar dark" style="width:70%;"></span><span class="bar" style="width:45%;"></span></div>
          </div>
          <!-- card 3 -->
          <div style="border:1.5px solid #e0ded7;border-radius:14px;padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:40px;height:40px;border-radius:10px;background:#eaf5ee;display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5ba777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="11" r="3"/></svg></div>
              <span class="tag" style="background:#eaf5ee;color:#5ba777;">Scan</span>
            </div>
            <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;"><span class="bar dark" style="width:75%;"></span><span class="bar" style="width:55%;"></span></div>
          </div>
        </div>

        <!-- ask AI banner -->
        <div style="margin-top:22px;border:1.5px solid #d1d6f5;background:#eef0ff;border-radius:14px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:42px;height:42px;border-radius:11px;background:#5b66cc;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>
            <div>
              <div class="hand" style="font-size:19px;color:#3a3f66;">Have a health question?</div>
              <div style="margin-top:6px;"><span class="bar" style="width:260px;background:#c3c8ee;"></span></div>
            </div>
          </div>
          <div class="btn primary">Ask Health OS →</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
