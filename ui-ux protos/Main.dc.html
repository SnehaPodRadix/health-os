<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap');
body{margin:0;background:#e9e8e3;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#4b4b52;}
.hand{font-family:'Architects Daughter','Comic Sans MS',cursive;}
a{color:#4b57c9;text-decoration:none;} a:hover{color:#333da3;}
.bar{background:#cfcfc9;border-radius:6px;height:10px;display:block;}
.bar.dark{background:#b6b6ae;}
.btn{border:1.5px solid #9a9a94;border-radius:24px;padding:12px 20px;background:#fff;color:#55555c;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-sizing:border-box;cursor:default;}
.btn.primary{background:#5b66cc;border-color:#5b66cc;color:#fff;}
.btn.block{width:100%;}
.field{border:1.5px solid #bcbcb5;border-radius:10px;background:#fff;height:48px;display:flex;align-items:center;padding:0 14px;gap:10px;}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#8a8a84;text-transform:uppercase;margin-bottom:7px;}
.dot{width:12px;height:12px;border-radius:50%;}
</style>
</helmet>

<div style="width:1200px;height:860px;box-sizing:border-box;padding:26px;display:flex;">
  <!-- browser window -->
  <div style="flex:1;display:flex;flex-direction:column;border:1.5px solid #c4c4bd;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.06);">
    <!-- chrome -->
    <div style="height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#f3f2ee;border-bottom:1.5px solid #dedcd5;">
      <span class="dot" style="background:#e2b3b0;"></span>
      <span class="dot" style="background:#e6d3a8;"></span>
      <span class="dot" style="background:#bcd6b4;"></span>
      <div style="flex:1;display:flex;justify-content:center;">
        <div style="min-width:320px;height:26px;border-radius:14px;background:#fff;border:1.5px solid #dcdad3;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#9a9a94;">healthos.app/login</div>
      </div>
    </div>

    <!-- split -->
    <div style="flex:1;display:flex;min-height:0;">
      <!-- brand panel -->
      <div style="width:460px;background:#e8ebff;border-right:1.5px solid #d7dbf7;box-sizing:border-box;padding:48px 44px;display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:42px;height:42px;border-radius:12px;background:#5b66cc;display:flex;align-items:center;justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
          </div>
          <span class="hand" style="font-size:26px;color:#3a3f66;">Health OS</span>
        </div>

        <div style="margin-top:56px;">
          <div class="hand" style="font-size:34px;line-height:1.25;color:#3a3f66;">Your health,<br>finally understood.</div>
          <div style="margin-top:16px;max-width:300px;display:flex;flex-direction:column;gap:9px;">
            <span class="bar" style="width:88%;"></span>
            <span class="bar" style="width:70%;"></span>
          </div>
        </div>

        <div style="margin-top:auto;display:flex;flex-direction:column;gap:18px;">
          <div style="display:flex;align-items:center;gap:13px;">
            <div style="width:34px;height:34px;border-radius:9px;background:#fff;border:1.5px solid #c6cbf0;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b66cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M7 3h8l5 5v13H7z"/><path d="M12 12v5M9.5 14.5h5" transform="translate(0 -1)"/></svg></div>
            <span style="font-size:15px;color:#54587a;">Upload records — images or PDF</span>
          </div>
          <div style="display:flex;align-items:center;gap:13px;">
            <div style="width:34px;height:34px;border-radius:9px;background:#fff;border:1.5px solid #c6cbf0;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b66cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>
            <span style="font-size:15px;color:#54587a;">Chat about any health concern</span>
          </div>
          <div style="display:flex;align-items:center;gap:13px;">
            <div style="width:34px;height:34px;border-radius:9px;background:#fff;border:1.5px solid #c6cbf0;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b66cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg></div>
            <span style="font-size:15px;color:#54587a;">Talk or type — in your language</span>
          </div>
        </div>
      </div>

      <!-- form -->
      <div style="flex:1;box-sizing:border-box;padding:64px 72px;display:flex;flex-direction:column;justify-content:center;">
        <div style="max-width:380px;width:100%;margin:0 auto;">
          <div class="hand" style="font-size:30px;color:#42424a;">Log in</div>
          <div style="margin-top:8px;"><span class="bar" style="width:180px;"></span></div>

          <div style="margin-top:34px;">
            <div class="lbl">Email</div>
            <div class="field"><span class="bar" style="width:150px;"></span></div>
          </div>
          <div style="margin-top:20px;">
            <div class="lbl">Password</div>
            <div class="field">
              <span class="bar" style="width:110px;flex:1;"></span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a8a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13.5px;">
            <span style="display:flex;align-items:center;gap:7px;color:#8a8a84;"><span style="width:15px;height:15px;border:1.5px solid #b6b6ae;border-radius:4px;display:inline-block;"></span>Remember me</span>
            <a href="#">Forgot password?</a>
          </div>

          <div style="margin-top:26px;"><div class="btn primary block">Log in</div></div>

          <div style="display:flex;align-items:center;gap:12px;margin:22px 0;">
            <span style="flex:1;height:1.5px;background:#e2e0d9;"></span>
            <span style="font-size:12.5px;color:#a8a8a2;">or</span>
            <span style="flex:1;height:1.5px;background:#e2e0d9;"></span>
          </div>

          <div class="btn block">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9a94" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Continue with Google
          </div>

          <div style="text-align:center;margin-top:24px;font-size:14px;color:#8a8a84;">New here? <a href="#">Create an account</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
